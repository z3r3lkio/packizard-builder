name: Build ShadowMountPlus exlz

on:
  push:
    branches:
      - feature/build-shadowmount-exlz
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shadowmount-exlz:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ShadowMountPlus 1.7beta4
        uses: actions/checkout@v4
        with:
          repository: drakmor/ShadowMountPlus
          ref: "1.7beta4"
          path: ShadowMountPlus
          fetch-depth: 0

      - name: Add .exlz support
        working-directory: ShadowMountPlus
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # 1) Treat .exlz exactly like exFAT at mount time.
          p = Path('src/sm_image.c')
          src = p.read_text()
          old = '  if (strcasecmp(dot, ".exfat") == 0)\n    return IMAGE_FS_EXFAT;'
          new = '  if (strcasecmp(dot, ".exfat") == 0 ||\n      strcasecmp(dot, ".exlz") == 0)\n    return IMAGE_FS_EXFAT;'
          if old not in src:
              raise SystemExit('Expected .exfat detector not found')
          p.write_text(src.replace(old, new, 1))

          # 2) Beyond the configured game-directory scan depth, continue
          #    recursively looking only for .exlz image files. This leaves
          #    upstream directory/game discovery semantics unchanged while
          #    allowing EXLZ images anywhere below a normal scan root.
          p = Path('src/sm_scan_tree.c')
          src = p.read_text()
          marker = 'bool sm_scan_tree_walk(const char *scan_root, const char *dir_path,\n'
          helper = r'''
          static bool sm_scan_tree_walk_exlz_deep(
              const char *scan_root, const char *dir_path, unsigned int depth_from_root,
              const sm_scan_tree_callbacks_t *callbacks, void *ctx) {
            if (should_stop_requested() || runtime_sleep_mode_active())
              return true;
          
            if (depth_from_root > 0u &&
                is_distinct_configured_scan_root(scan_root, dir_path)) {
              return true;
            }
          
            DIR *d = opendir(dir_path);
            if (!d)
              return errno == ENOENT || errno == ENOTDIR;
          
            bool scan_root_is_pfsc_mount_base =
                is_pfsc_image_mount_base_or_child(scan_root);
            bool allow_image_file_visits =
                callbacks->on_image_file &&
                (!path_matches_root_or_child(scan_root, IMAGE_MOUNT_BASE) ||
                 scan_root_is_pfsc_mount_base);
          
            int read_error = 0;
            for (;;) {
              errno = 0;
              struct dirent *entry = readdir(d);
              if (!entry) {
                read_error = errno;
                break;
              }
              if (should_stop_requested() || runtime_sleep_mode_active()) {
                closedir(d);
                return true;
              }
              if (entry->d_name[0] == '.')
                continue;
          
              char full_path[MAX_PATH];
              int written =
                  snprintf(full_path, sizeof(full_path), "%s/%s", dir_path, entry->d_name);
              if (written < 0 || (size_t)written >= sizeof(full_path))
                continue;
          
              bool is_dir = false;
              bool is_regular = false;
              if (!classify_scan_tree_entry(full_path, entry->d_type, &is_dir,
                                            &is_regular)) {
                read_error = errno;
                break;
              }
          
              if (allow_image_file_visits && is_regular) {
                const char *dot = strrchr(entry->d_name, '.');
                if (dot && strcasecmp(dot, ".exlz") == 0 &&
                    is_supported_image_file_path(full_path, entry->d_name)) {
                  if (!callbacks->on_image_file(full_path, entry->d_name,
                                                depth_from_root + 1u, ctx)) {
                    closedir(d);
                    return false;
                  }
                }
              }
          
              if (is_dir &&
                  !sm_scan_tree_walk_exlz_deep(scan_root, full_path,
                                               depth_from_root + 1u, callbacks, ctx)) {
                closedir(d);
                return false;
              }
            }
          
            if (closedir(d) != 0 && read_error == 0)
              read_error = errno;
            if (read_error != 0)
              errno = read_error;
            return read_error == 0;
          }
          
'''
          if marker not in src:
              raise SystemExit('sm_scan_tree_walk marker not found')
          src = src.replace(marker, helper + marker, 1)
          old_depth = '  if (remaining_depth == 0u)\n    return true;'
          new_depth = '''  if (remaining_depth == 0u) {
    // Preserve upstream scan_depth for directories/games, but EXLZ images
    // are allowed at any depth below a configured scan root.
    return sm_scan_tree_walk_exlz_deep(scan_root, dir_path, depth_from_root,
                                       callbacks, ctx);
  }'''
          if old_depth not in src:
              raise SystemExit('remaining_depth guard not found')
          p.write_text(src.replace(old_depth, new_depth, 1))
          PY

          grep -n -A4 -B2 'exlz' src/sm_image.c
          grep -n -A6 -B3 'sm_scan_tree_walk_exlz_deep' src/sm_scan_tree.c

      - name: Checkout pacbrew-repo
        uses: actions/checkout@v4
        with:
          repository: ps5-payload-dev/pacbrew-repo
          path: pacbrew-repo

      - name: Checkout SDK stubs
        uses: actions/checkout@v4
        with:
          repository: ps5-payload-dev/sdk
          path: ps5-sdk

      - name: Setup build environment
        run: |
          sudo apt update
          sudo apt install -y autoconf automake build-essential clang-18 cmake curl git libarchive-tools libtool lld-18 makepkg meson pacman-package-manager pkg-config python3 python3-yaml xxd zip

      - name: Build PS5 payload SDK
        working-directory: pacbrew-repo/sdk
        run: |
          makepkg -c -f
          sudo pacman --noconfirm -U ./ps5-payload-*.pkg.tar.gz

      - name: Build PS5 dependencies
        shell: bash
        run: |
          set -euo pipefail
          for pkg in openlibm json-c zlib libpng libmicrohttpd sqlite; do
            pushd "pacbrew-repo/$pkg"
            makepkg -c -f
            sudo pacman --noconfirm -U ./ps5-payload-*.pkg.tar.gz
            popd
          done

      - name: Build ShadowMountPlus
        working-directory: ShadowMountPlus
        run: |
          make clean all VERSION_TAG=1.7beta4-exlz PS5_SCE_STUBS_DIR="$GITHUB_WORKSPACE/ps5-sdk/sce_stubs"
          file shadowmountplus.elf
          sha256sum shadowmountplus.elf | tee shadowmountplus.elf.sha256

      - name: Upload ELF
        uses: actions/upload-artifact@v4
        with:
          name: shadowmountplus-1.7beta4-exlz-elf
          retention-days: 7
          if-no-files-found: error
          path: |
            ShadowMountPlus/shadowmountplus.elf
            ShadowMountPlus/shadowmountplus.elf.sha256
