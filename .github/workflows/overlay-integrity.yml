name: Verify Packizard overlay integrity

on:
  pull_request:
    branches:
      - UAT
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-overlay:
    name: Overlay integrity
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Verify integrated overlay fragments and payload
        run: python ci/verify_integrated_overlay.py
