name: Package Packizard Builder

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - UAT
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.12'
  DOTNET_VERSION: '10.0.x'

jobs:
  policy:
    name: PR policy · branch flow
    runs-on: ubuntu-24.04
    steps:
      - name: Enforce promotion path
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          case "$BASE_REF" in
            main)
              if [[ "$HEAD_REF" != "UAT" ]]; then
                echo "PRs into main must come from UAT. Got: $HEAD_REF" >&2
                exit 1
              fi
              ;;
            UAT)
              if [[ "$HEAD_REF" != feature/* ]]; then
                echo "PRs into UAT must come from feature/* branches. Got: $HEAD_REF" >&2
                exit 1
              fi
              ;;
          esac

  verify:
    name: Tests · Linux x64
    needs: policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: x64
      - uses: actions/setup-dotnet@v5.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Install headless Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0
      - name: Reconstruct complete source tree
        run: python ci/bootstrap_source.py --output build-src
      - name: Apply Packizard-native NAPS engine
        run: python ci/naps_u2c_partial_group_profile.py --root build-src
      - name: Build and probe integrated PKG engine
        working-directory: build-src
        run: |
          python scripts/prepare_pkg_bridge.py --rid linux-x64
          ./pkg_bridge/linux-x64/Packizard.PkgBridge probe | tee /tmp/packizard-pkg-probe.json
          grep -F '"engine":"LibProsperoPKG"' /tmp/packizard-pkg-probe.json
          grep -F '"pprGuiReferenceVersion":"0.6.8"' /tmp/packizard-pkg-probe.json
      - name: Validate packaging integration
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'scripts/prepare_pkg_bridge.py --rid "linux-$arch"' build-src/build_linux.sh
          grep -F 'scripts/prepare_pkg_bridge.py --rid "osx-$arch"' build-src/build_macos.sh
          grep -F 'scripts\prepare_pkg_bridge.py --rid $rid' build-src/build_windows.ps1
          grep -F 'codesign --force --sign - "$app/Contents/MacOS/pkg_bridge/Packizard.PkgBridge"' build-src/build_macos.sh
          grep -F 'rm -rf -- "$appdir/usr/share/metainfo"' build-src/build_linux.sh
          grep -F 'BuildToFile(IReadOnlyList<ProsperoPs5InnerPayload>' build-src/vendor/LibProsperoPKG/src/LibProsperoPkg/PFS/ProsperoPs5InnerImageBuilder.cs
          grep -F 'BuildForPackageToFile(' build-src/vendor/LibProsperoPKG/src/LibProsperoPkg/PFS/ProsperoOuterPfsBuilder.cs
          grep -F 'BuildDebugSiSegmentFromFile(' build-src/vendor/LibProsperoPKG/src/LibProsperoPkg/PKG/ProsperoSiArchive.cs
          grep -F 'Packizard canonical DATA block map' build-src/vendor/LibProsperoPKG/src/LibProsperoPkg/PFS/ProsperoPs5InnerImageAssembler.cs
          grep -F 'private byte[] BuildNativeImage' build-src/vendor/LibProsperoPKG/src/LibProsperoPkg/PFS/ProsperoPs5InnerImageAssembler.cs
          grep -F 'RoundUp(dataStream.LogicalLength, BlockSize)' build-src/vendor/LibProsperoPKG/src/LibProsperoPkg/PFS/ProsperoPs5InnerImageAssembler.cs
          grep -F 'PackizardNativeNapsEngine.Generate(asmResult)' build-src/vendor/LibProsperoPKG/src/LibProsperoPkg/PKG/ProsperoPkgBuilder.cs
          grep -F 'PackizardNativeNapsWriter.Serialize(doc)' build-src/vendor/LibProsperoPKG/src/LibProsperoPkg/PKG/PackizardNativeNapsEngine.cs
          grep -F 'private static void WriteU2c' build-src/vendor/LibProsperoPKG/src/LibProsperoPkg/PKG/PackizardNativeNapsWriter.cs
          grep -F 'PackizardNativeNapsValidator.ValidateDocument' build-src/vendor/LibProsperoPKG/src/LibProsperoPkg/PKG/PackizardNativeNapsWriter.cs
          if grep -Fq 'ProsperoNwonlyNapsGenerator.Generate(asmResult)' build-src/vendor/LibProsperoPKG/src/LibProsperoPkg/PKG/ProsperoPkgBuilder.cs; then
            echo "Legacy NAPS topology generator leaked into the Packizard-native PKG path" >&2
            exit 1
          fi
          if grep -R -Fq 'ProsperoNapsLayout.BuildLayout(' build-src/vendor/LibProsperoPKG/src/LibProsperoPkg/PKG/PackizardNativeNaps*.cs; then
            echo "Legacy NAPS serializer leaked into the Packizard-native path" >&2
            exit 1
          fi
          if grep -R -Fq 'LibProsperoPkg.Gui.exe' build-src/core build-src/gui build-src/utils; then
            echo "External PKG GUI launcher leaked back into runtime code" >&2
            exit 1
          fi
      - name: Test bootstrap and streaming regressions
        run: |
          python -m unittest discover -s tests -v
          dotnet run --project ci/tests/StreamingRegression -- --large
      - name: Install test dependencies
        working-directory: build-src
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
      - name: Run tests
        working-directory: build-src
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        working-directory: build-src
        run: python -m compileall -q .

  package:
    name: ${{ matrix.platform }} · ${{ matrix.arch }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            os: windows-2025
            arch: x64
            artifact: packizard-builder-windows-x64
          - platform: Linux
            os: ubuntu-24.04
            arch: x64
            artifact: packizard-builder-linux-x64
          - platform: macOS
            os: macos-15-intel
            arch: x64
            artifact: packizard-builder-macos-x64
          - platform: macOS
            os: macos-15
            arch: arm64
            artifact: packizard-builder-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: ${{ matrix.arch == 'arm64' && 'arm64' || 'x64' }}
      - uses: actions/setup-dotnet@v5.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0
      - name: Reconstruct complete source tree
        run: python ci/bootstrap_source.py --output build-src
      - name: Apply Packizard-native NAPS engine
        run: python ci/naps_u2c_partial_group_profile.py --root build-src
      - name: Build Windows package
        if: runner.os == 'Windows'
        working-directory: build-src
        shell: pwsh
        run: ./build_windows.ps1 -Arch ${{ matrix.arch }}
      - name: Build Linux package
        if: runner.os == 'Linux'
        working-directory: build-src
        run: ./build_linux.sh --arch ${{ matrix.arch }}
      - name: Build macOS package
        if: runner.os == 'macOS'
        working-directory: build-src
        run: ./build_macos.sh --arch ${{ matrix.arch }}
      - name: Upload Windows package
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: build-src/dist/*
          if-no-files-found: error
      - name: Upload Linux package
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: build-src/dist/*
          if-no-files-found: error
      - name: Upload macOS package
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: build-src/dist/*
          if-no-files-found: error

  golden:
    name: Golden build
    needs: package
    runs-on: ubuntu-24.04
    steps:
      - run: echo "All platform builds completed successfully."

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: golden
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: false
      - name: Create release archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-files
          while IFS= read -r -d '' dir; do
            name="$(basename "$dir")"
            if [[ "$name" == *windows* ]]; then
              (cd "$dir" && zip -9 -r "../../release-files/${name}.zip" .)
            else
              tar -C "$dir" -czf "release-files/${name}.tar.gz" .
            fi
          done < <(find release-assets -mindepth 1 -maxdepth 1 -type d -print0)
      - uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
