name: Package Packizard Builder

on:
  push:
    branches: [UAT, main]
    tags: ['v*']
  pull_request:
    branches: [UAT, main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.12'
  DOTNET_VERSION: '10.0.x'

jobs:
  policy:
    name: PR policy · branch flow
    runs-on: ubuntu-24.04
    steps:
      - name: Enforce promotion path
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          case "$BASE_REF" in
            main) [[ "$HEAD_REF" == "UAT" ]] || { echo "PRs into main must come from UAT" >&2; exit 1; } ;;
            UAT) [[ "$HEAD_REF" == feature/* ]] || { echo "PRs into UAT must come from feature/*" >&2; exit 1; } ;;
          esac

  verify:
    name: Tests · Linux x64
    needs: policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: x64
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Install headless Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-shape0 libxcb-keysyms1
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
      - name: Prepare and probe integrated PKG engine
        run: |
          python scripts/prepare_pkg_bridge.py --rid linux-x64
          ./pkg_bridge/linux-x64/Packizard.PkgBridge probe | tee /tmp/packizard-pkg-probe.json
          grep -F '"engine":"LibProsperoPKG"' /tmp/packizard-pkg-probe.json
      - name: Assert Packizard-owned engine layout
        shell: bash
        run: |
          set -euo pipefail
          test -f packizard_engine/packer.py
          test -f packizard_engine/packizard_container.py
          test -f packizard_engine/packizard_lz4.py
          test -f packizard_runtime/ps5/packizard_ps5_runtime/Makefile
          test -d packizard_runtime/ps5/packizard_ps5_runtime/src
          test ! -e external/ampr_emu
          test ! -e ci/bootstrap_source.py
      - name: Validate bundled Packizard PS5 Runtime
        run: python scripts/validate_packizard_runtime.py
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v
      - name: Compile first-party Python sources
        run: python -m compileall -q main.py core gui packizard_engine scripts utils tests

  build:
    name: ${{ matrix.platform }} · ${{ matrix.arch }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: Windows, os: windows-2025, arch: x64, artifact: packizard-builder-windows-x64 }
          - { platform: Linux, os: ubuntu-24.04, arch: x64, artifact: packizard-builder-linux-x64 }
          - { platform: macOS, os: macos-15-intel, arch: x64, artifact: packizard-builder-macos-x64 }
          - { platform: macOS, os: macos-15, arch: arm64, artifact: packizard-builder-macos-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: ${{ matrix.arch == 'arm64' && 'arm64' || 'x64' }}
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-shape0 libxcb-keysyms1
      - name: Build Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PYTHONWARNINGS: 'ignore:invalid escape sequence:SyntaxWarning'
        run: |
          python -m venv .venv312
          .\.venv312\Scripts\python -m pip install --upgrade pip
          .\.venv312\Scripts\python -m pip install -r requirements-build.txt
          .\build_windows.ps1 -Architecture ${{ matrix.arch }}
      - name: Build Linux package
        if: runner.os == 'Linux'
        env:
          PYTHON: python3
          PYTHONWARNINGS: 'ignore:invalid escape sequence:SyntaxWarning'
          PACKIZARD_TARGET_ARCH: ${{ matrix.arch }}
        run: ./build_linux.sh
      - name: Build macOS package
        if: runner.os == 'macOS'
        env:
          PYTHON: python3
          PYTHONWARNINGS: 'ignore:invalid escape sequence:SyntaxWarning'
          PACKIZARD_TARGET_ARCH: ${{ matrix.arch }}
        run: ./build_macos.sh
      - name: Verify Windows single-executable archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = Get-ChildItem -Path ..\release -Recurse -Filter 'Packizard-Builder-*-Windows-*.zip' | Select-Object -First 1
          if (-not $archive) { throw 'Windows release ZIP not found' }
          $zip = [System.IO.Compression.ZipFile]::OpenRead($archive.FullName)
          try {
            $entries = @($zip.Entries | Where-Object { -not [string]::IsNullOrWhiteSpace($_.Name) })
            if ($entries.Count -ne 1 -or $entries[0].Name -ne 'Packizard-Builder.exe') {
              throw "Windows release ZIP must contain exactly Packizard-Builder.exe; found: $($entries.FullName -join ', ')"
            }
          }
          finally { $zip.Dispose() }
      - name: Upload Windows package
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: |
            ../release/*-windows-${{ matrix.arch }}/Packizard-Builder-*-Windows-${{ matrix.arch }}.zip
            ../release/*-windows-${{ matrix.arch }}/SHA256SUMS-Windows-${{ matrix.arch }}.txt
          if-no-files-found: error
      - name: Upload Linux package
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: |
            ../release/*-linux-${{ matrix.arch }}/Packizard-Builder-*-Linux-${{ matrix.arch }}.AppImage
            ../release/*-linux-${{ matrix.arch }}/Packizard-Builder-*-Linux-${{ matrix.arch }}.tar.gz
            ../release/*-linux-${{ matrix.arch }}/SHA256SUMS-Linux-${{ matrix.arch }}.txt
          if-no-files-found: error
      - name: Upload macOS package
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: |
            ../release/*-macos-${{ matrix.arch }}/Packizard-Builder-*-macOS-${{ matrix.arch }}.zip
            ../release/*-macos-${{ matrix.arch }}/Packizard-Builder-*-macOS-${{ matrix.arch }}.tar.gz
            ../release/*-macos-${{ matrix.arch }}/SHA256SUMS-macOS-${{ matrix.arch }}.txt
          if-no-files-found: error

  golden:
    name: Golden build
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - run: echo "All platform builds completed successfully."

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: golden
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.1
        with:
          path: release-assets
          merge-multiple: false
      - name: Create release archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-files
          while IFS= read -r -d '' dir; do
            name="$(basename "$dir")"
            if [[ "$name" == *windows* ]]; then
              (cd "$dir" && zip -9 -r "../../release-files/${name}.zip" .)
            else
              tar -C "$dir" -czf "release-files/${name}.tar.gz" .
            fi
          done < <(find release-assets -mindepth 1 -maxdepth 1 -type d -print0)
      - uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
