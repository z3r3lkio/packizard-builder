name: Auto-update ShadowMountPlus upstream

on:
  schedule:
    - cron: "23 05 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shadowmount-upstream-auto-update
  cancel-in-progress: false

jobs:
  update-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout custom ShadowMount branch
        uses: actions/checkout@v4
        with:
          ref: feature/build-shadowmount-exlz
          fetch-depth: 0

      - name: Detect latest Drakmor release
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          latest="$(
            curl -fsSL --retry 3               -H 'Accept: application/vnd.github+json'               -H 'X-GitHub-Api-Version: 2022-11-28'               'https://api.github.com/repos/drakmor/ShadowMountPlus/releases?per_page=20' |
            python3 -c '
import json, sys
releases = json.load(sys.stdin)
for release in releases:
    if release.get("draft"):
        continue
    tag = release.get("tag_name", "")
    if tag:
        print(tag)
        break
'
          )"

          current="$(
            python3 - <<'PY'
from pathlib import Path
import re
text = Path(".github/workflows/build-shadowmount-exlz.yml").read_text()
m = re.search(r'^\s*UPSTREAM_TAG:\s*"([^"]+)"\s*$', text, re.M)
if not m:
    raise SystemExit("UPSTREAM_TAG not found")
print(m.group(1))
PY
          )"

          if [ -z "$latest" ]; then
            echo "Could not resolve latest upstream release" >&2
            exit 1
          fi

          echo "current=$current"
          echo "latest=$latest"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"

          if [ "$latest" = "$current" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate upstream tag and patch anchors
        if: steps.detect.outputs.changed == 'true'
        shell: bash
        env:
          LATEST_TAG: ${{ steps.detect.outputs.latest }}
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          git clone --depth 1 --branch "$LATEST_TAG"             https://github.com/drakmor/ShadowMountPlus.git "$tmp/upstream"

          python3 - "$tmp/upstream" <<'PY'
from pathlib import Path
import sys

root = Path(sys.argv[1])
checks = {
    "src/sm_image.c": [
        'strcasecmp(dot, ".exfat")',
        'strcasecmp(dot, ".ffpfsc")',
        'detect_image_fs_type',
    ],
    "src/sm_scan_tree.c": [
        'sm_scan_tree_walk',
        'remaining_depth == 0u',
        'is_distinct_configured_scan_root',
    ],
    "src/sm_scan.c": [
        'collect_scan_candidates_from_manual_root',
        'collect_scan_candidates_from_manual_list',
        'collect_candidate_image_visit',
    ],
    "src/sm_gameinfo.c": [
        'is_supported_game_title_id',
    ],
}
missing = []
for rel, needles in checks.items():
    path = root / rel
    if not path.is_file():
        missing.append(f"{rel}: file missing")
        continue
    text = path.read_text(errors="replace")
    for needle in needles:
        if needle not in text:
            missing.append(f"{rel}: missing anchor {needle!r}")
if missing:
    raise SystemExit("Upstream compatibility check failed:\n" + "\n".join(missing))
print("Upstream patch anchors look compatible.")
PY

      - name: Update pinned upstream tag
        if: steps.detect.outputs.changed == 'true'
        shell: bash
        env:
          LATEST_TAG: ${{ steps.detect.outputs.latest }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
from pathlib import Path
import os, re

path = Path(".github/workflows/build-shadowmount-exlz.yml")
text = path.read_text()
latest = os.environ["LATEST_TAG"]
new, count = re.subn(
    r'^(\s*UPSTREAM_TAG:\s*)"[^"]+"\s*$',
    lambda m: f'{m.group(1)}"{latest}"',
    text,
    count=1,
    flags=re.M,
)
if count != 1:
    raise SystemExit("Could not update UPSTREAM_TAG exactly once")
path.write_text(new)
PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/build-shadowmount-exlz.yml
          git commit -m "Auto-update ShadowMountPlus upstream to $LATEST_TAG"
          git push origin HEAD:feature/build-shadowmount-exlz

      - name: No update required
        if: steps.detect.outputs.changed != 'true'
        run: echo "ShadowMountPlus is already pinned to the latest Drakmor release."
